<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E2015">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Dice Football</title>
<style>
:root{
  --turf:#0E2015;
  --turf2:#0A180F;
  --panel:#13291C;
  --panel2:#0C1B11;
  --edge:#22432F;
  --chalk:#F1F4EC;
  --muted:#8CA795;
  --amber:#FFB44D;
  --red:#FF6B5E;
  --td:#6FE39A;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;
  background:var(--turf);
  color:var(--chalk);
  min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom);
}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    repeating-linear-gradient(90deg, transparent 0 62px, rgba(241,244,236,.05) 62px 64px),
    radial-gradient(120% 90% at 50% 0%, #143122 0%, var(--turf) 55%, var(--turf2) 100%);
}
#app{max-width:480px;margin:0 auto;padding:10px 12px 40px}

/* ---------- type ---------- */
.eyebrow{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-size:1.9rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
.digits{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- scoreboard ---------- */
#scorebar{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,#0B1810 0%,#102418 100%);
  border:1px solid var(--edge);border-radius:16px;
  padding:10px 12px calc(10px);
  margin-bottom:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.45);
}
.sb-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.sb-team{text-align:center;border-radius:10px;padding:6px 4px;position:relative}
.sb-team.poss{background:rgba(255,180,77,.08);outline:1px solid rgba(255,180,77,.35)}
.sb-name{font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-team.poss .sb-name{color:var(--amber)}
.sb-score{font-family:var(--mono);font-size:2.1rem;font-weight:700;color:var(--chalk);line-height:1.05}
.sb-mid{text-align:center;min-width:96px}
.sb-q{font-size:.7rem;letter-spacing:.15em;color:var(--muted);font-weight:800;text-transform:uppercase}
.sb-clock{font-family:var(--mono);font-size:1.55rem;font-weight:700;color:var(--amber);cursor:pointer;user-select:none;line-height:1.15}
.sb-clock.stopped{color:var(--muted)}
.sb-down{font-size:.7rem;letter-spacing:.12em;color:var(--chalk);font-weight:700;text-transform:uppercase;cursor:pointer}
.possdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-right:4px;vertical-align:1px}
.sb-tools{display:flex;justify-content:space-between;margin-top:8px}
.tool{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:none;border:none;font-weight:700;padding:4px 6px;cursor:pointer}
.tool:active{color:var(--chalk)}

/* ---------- cards / stage ---------- */
.card{
  background:linear-gradient(180deg,var(--panel) 0%,var(--panel2) 100%);
  border:1px solid var(--edge);border-radius:16px;
  padding:14px;margin-bottom:12px;
}
.card h2{font-size:.95rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.hint{font-size:.8rem;color:var(--muted);line-height:1.45}
.bigtime{font-family:var(--mono);font-size:3.4rem;font-weight:700;text-align:center;letter-spacing:.02em;margin:6px 0;color:var(--chalk)}
.bigtime.over{color:var(--red)}
.bucketline{display:flex;gap:6px;justify-content:center;margin:4px 0 10px;flex-wrap:wrap}
.bkt{font-family:var(--mono);font-size:.72rem;padding:3px 8px;border-radius:999px;border:1px solid var(--edge);color:var(--muted)}
.bkt.on{border-color:var(--amber);color:var(--amber)}
.bkt.dead{border-color:rgba(255,107,94,.5);color:var(--red)}

/* ---------- buttons ---------- */
button.btn{
  display:block;width:100%;padding:15px 12px;margin-top:10px;
  border-radius:14px;border:1px solid var(--edge);
  background:#183626;color:var(--chalk);
  font-size:1rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  cursor:pointer;
}
button.btn:active{transform:scale(.985)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#20160a}
.btn.red{background:rgba(255,107,94,.14);border-color:rgba(255,107,94,.6);color:var(--red)}
.btn.ghost{background:transparent}
.btn.sm{padding:10px;font-size:.82rem;margin-top:8px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btnrow .btn{margin-top:8px}

/* ---------- chips (big plays / coach) ---------- */
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:2px}
.chip{
  padding:10px 8px;border-radius:12px;border:1px dashed var(--edge);
  background:transparent;color:var(--chalk);font-weight:700;font-size:.8rem;
  letter-spacing:.04em;cursor:pointer;text-align:center;
}
.chip small{display:block;font-weight:600;font-size:.62rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.chip:disabled{opacity:.32}
.chip.shot{border-color:rgba(255,180,77,.55)}
.chip.shot small{color:var(--amber)}

/* ---------- roll panel ---------- */
.stakes{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.stake{font-family:var(--mono);font-size:.74rem;padding:4px 9px;border-radius:8px;border:1px solid var(--edge)}
.stake b{color:var(--amber)}
.die{
  font-family:var(--mono);font-size:4rem;font-weight:800;text-align:center;
  margin:10px auto;width:96px;height:96px;line-height:92px;
  border:2px solid var(--edge);border-radius:18px;background:var(--panel2);
}
.die.hot{border-color:var(--amber);color:var(--amber)}
.manualdice{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.manualdice button{padding:14px 0;font-family:var(--mono);font-size:1.2rem;font-weight:700;border-radius:10px;border:1px solid var(--edge);background:#183626;color:var(--chalk)}
.result{
  text-align:center;font-size:1.5rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  margin:10px 0 2px;
}
.result.good{color:var(--td)}
.result.bad{color:var(--red)}
.result.mid{color:var(--amber)}
.subnote{text-align:center;font-size:.8rem;color:var(--muted);margin-top:2px}

/* ---------- log & stats ---------- */
details{border:1px solid var(--edge);border-radius:14px;background:var(--panel2);margin-bottom:10px;overflow:hidden}
summary{padding:12px 14px;font-size:.8rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
.logline{padding:7px 14px;font-size:.8rem;border-top:1px solid rgba(34,67,47,.5);line-height:1.4}
.logline .lt{font-family:var(--mono);color:var(--muted);margin-right:6px;font-size:.7rem}
.statgrid{width:100%;border-collapse:collapse;margin:4px 0 10px}
.statgrid th,.statgrid td{padding:6px 10px;font-size:.8rem;text-align:center;border-top:1px solid rgba(34,67,47,.5)}
.statgrid th{color:var(--muted);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase}
.statgrid td:first-child,.statgrid th:first-child{text-align:left}
.statgrid td{font-family:var(--mono)}

/* ---------- reference tables ---------- */
.ref{padding:0 14px 12px}
.ref h3{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin:12px 0 4px}
.ref table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:.7rem}
.ref td,.ref th{border:1px solid var(--edge);padding:4px 6px;text-align:center;color:var(--chalk)}
.ref th{color:var(--muted);font-family:inherit}
.ref p{font-size:.72rem;color:var(--muted);margin:4px 0;line-height:1.45}

/* ---------- overlay / modal ---------- */
#overlay{
  position:fixed;inset:0;background:rgba(5,12,8,.82);z-index:50;
  display:none;align-items:flex-end;justify-content:center;
}
#overlay.show{display:flex}
#sheet{
  width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
  background:var(--panel);border:1px solid var(--edge);border-radius:20px 20px 0 0;
  padding:16px 16px calc(24px + env(safe-area-inset-bottom));
}
#sheet h2{font-size:1rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
.field{margin-bottom:12px}
.field label{display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:5px}
.field input,.field select{
  width:100%;padding:12px;border-radius:12px;border:1px solid var(--edge);
  background:var(--panel2);color:var(--chalk);font-size:1rem;
}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{padding:11px;border-radius:12px;border:1px solid var(--edge);background:var(--panel2);color:var(--muted);font-weight:700;font-size:.85rem}
.seg button.on{border-color:var(--amber);color:var(--amber)}

/* ---------- setup / final ---------- */
.hero{text-align:center;padding:26px 8px 14px}
.hero .eyebrow{margin-bottom:6px}
.drinkline{display:flex;justify-content:center;gap:10px;align-items:center;margin:8px 0 2px;font-size:.85rem;font-weight:700}
.drinkline .vs{color:var(--muted);font-size:.7rem;letter-spacing:.15em}
.drinkline .dp{padding:5px 12px;border-radius:999px;border:1px solid var(--edge);background:var(--panel2)}
.drinkline .dp.off{border-color:rgba(255,180,77,.5);color:var(--amber)}
.pickbtn{display:block;width:100%;padding:13px;margin-top:8px;border-radius:12px;border:1px solid var(--edge);background:var(--panel2);color:var(--chalk);font-size:.95rem;font-weight:700;text-align:left}
.pickbtn small{float:right;color:var(--muted);font-weight:600}
.pickbtn.cur{border-color:var(--amber)}
.oddswrap{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 2px}
.oddswrap.one{grid-template-columns:1fr}
.oddstbl{border:1px solid var(--edge);border-radius:10px;padding:6px 8px;background:var(--panel2);transition:border-color .2s,opacity .2s}
.oddstbl.live{border-color:var(--amber);box-shadow:0 0 0 1px rgba(255,180,77,.25)}
.oddstbl.deadzone{opacity:.4}
.oth{font-family:var(--mono);font-size:.68rem;color:var(--amber);font-weight:700;margin-bottom:3px}
.oline{font-family:var(--mono);font-size:.6rem;color:var(--chalk);line-height:1.6;overflow-wrap:break-word}
.oline b{color:var(--muted);font-weight:700;margin-right:3px}
.hero h1 span{color:var(--amber)}
.finalscore{font-family:var(--mono);font-size:2.6rem;font-weight:800;text-align:center;margin:8px 0}
.winner{text-align:center;color:var(--td);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:.9rem}
.notice{font-size:.75rem;color:var(--muted);text-align:center;margin-top:10px;line-height:1.5}
.splash{position:fixed;top:36%;left:50%;transform:translate(-50%,-50%);background:rgba(9,20,13,.96);border:2px solid var(--amber);border-radius:18px;padding:20px 28px;font-size:1.35rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;z-index:80;text-align:center;max-width:86vw;box-shadow:0 10px 40px rgba(0,0,0,.6);animation:pop .25s}
.splash.bad{border-color:var(--red);color:var(--red)}
.splash.good{border-color:var(--td);color:var(--td)}
.splash.out{opacity:0;transition:opacity .4s}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.72);opacity:0}}
button.btn:disabled,.chip:disabled{opacity:.32;pointer-events:none}
@media (orientation:landscape) and (min-width:640px){
  #app{max-width:960px}
  .gamecols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:12px;align-items:start}
  .colL,.colR{min-width:0}
  .colR{position:sticky;top:8px;max-height:calc(100vh - 16px);overflow-y:auto;-webkit-overflow-scrolling:touch}
  #scorebar{position:static}
}
@media (prefers-reduced-motion:no-preference){
  .die.rolling{animation:shake .09s infinite}
  @keyframes shake{0%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}100%{transform:rotate(-3deg)}}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"><div id="sheet"></div></div>
<script>
/* ============ Dice Football v3 ============
   Rows = downs. A first down advances one row (tighter times = a new set of
   downs). Turnover or score ends the possession; opponent restarts at down 1.
   Roles in online rooms: host controls everything; players control their team;
   guests watch. Clock runs only while a chug is live.
========================================== */
const LSK='dfb_state_v3', LSH='dfb_hist_v2';
const THRESH={1:{a:240,b:360},2:{a:180,b:300},3:{a:120,b:240},4:{a:90,b:90}}; // at 15:00 quarters
function thr(r){ const f=(S&&S.qlen?S.qlen:900)/900; const t=THRESH[r]; const m=S?(S.defMod||0):0;
  return {a:Math.max(10,t.a*f+m), b:Math.max(15,t.b*f+m)}; }
const modUnit=()=>60*((S&&S.qlen?S.qlen:900)/900);
const TABLES={
  fast:{no:{1:'TO',2:'FD',3:'FD',4:'TD',5:'TD',6:'TD'}, def:{1:'TO',2:'TO',3:'FD',4:'FD',5:'FD',6:'FD'}},
  mid: {no:{1:'TO',2:'TO',3:'FD',4:'FD',5:'TD',6:'TD'}, def:{1:'TO',2:'TO',3:'TO',4:'FD',5:'FD',6:'FD'}},
  four:{no:{1:'TO',2:'FD',3:'FG',4:'FG',5:'TD',6:'TD'}, def:{1:'TO',2:'TO',3:'TO',4:'FD',5:'FD',6:'FG'}}
};
const BIG={
  hail:  {name:'Hail Mary', side:'off', map:{1:'HM_TO',2:'N',3:'N',4:'N',5:'N',6:'TD'}},
  fourth:{name:'4th Down',  side:'off', map:{1:'TO',2:'TO',3:'TO',4:'FD',5:'FD',6:'FD'}},
  sack:  {name:'Sack',      side:'def', map:{1:'FD',2:'N',3:'N',4:'N',5:'SACK',6:'SACK'}},
  int:   {name:'Interception',side:'def',map:{1:'OFF_TD',2:'N',3:'N',4:'N',5:'N',6:'INT_TO'}}
};
const COACH={
  wildcat:{name:'Wildcat', map:{1:'SUB',2:'SUB',3:'SUB',4:'SUBMOD',5:'SUBMOD',6:'TO'}, mod:+60, who:'offense'},
  blitz:  {name:'Blitz',   map:{1:'SUB',2:'SUB',3:'SUB',4:'SUBMOD',5:'SUBMOD',6:'TO'}, mod:-60, who:'defense'}
};
const SUB_SUCCESS=[4,5,6];
const DEFAULT_SERVER='https://dice-football-room.pflegac.workers.dev';

let S=null, hist=[], snaps=[], tick=null, clockTick=null, shownEvt=0, wakeLock=null;
const R={url:localStorage.getItem('dfb_server')||'',code:null,ws:null,seq:0,applying:false,hosting:false,retry:null,pinger:null};

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const qname=q=>q<=4?'Q'+q:'OT'+(q-4>1?q-4:'');
const other=i=>1-i;
const now=()=>Date.now()/1000;
const elapsedDrink=()=>S.pauseE!=null?S.pauseE:(S.t0?now()-S.t0:0);
const effClock=()=>S&&S.running&&S.canchor?Math.max(0,S.clock-(now()-S.canchor)):(S?S.clock:0);
const roster=i=>S.teams[i].players;
const guestOf=i=>{ const t=S.teams[i]; if(!t.guest)t.guest={name:'Guest_'+(i===0?'Home':'Away'),shots:0,chugsO:[],chugsD:[]}; return t.guest; };
const drinker=i=>(S.guestIn&&S.guestIn[i])?guestOf(i):roster(i)[S.rot[i]%roster(i).length];
function freshStats(){return {td:0,fg:0,to:0,fd:0,shots:0,coach:0,chugsO:[],chugsD:[],stops:0}}
const avgT=c=>c&&c.length?fmt(c.reduce((a,b)=>a+b,0)/c.length):'—';
const drinkCt=p=>((p.chugsO||[]).length+(p.chugsD||[]).length);
function evt(txt,kind){ if(!S)return; S.evt={n:((S.evt&&S.evt.n)||0)+1,txt,kind:kind||''}; }
function snapshot(){ snaps.push(JSON.stringify(S)); if(snaps.length>30)snaps.shift(); }
function undo(){ if(!isHost()||!snaps.length)return; S=JSON.parse(snaps.pop()); shownEvt=(S.evt&&S.evt.n)||0;
  stopDrinkTick(); if(S.dphase==='drink'&&S.t0&&S.pauseE==null)startDrinkTick(); render(); }

/* ---------- roles ---------- */
function myRole(){ if(!R.code)return {role:'host'};
  try{ return JSON.parse(localStorage.getItem('dfb_who_'+R.code))||null; }catch(e){ return null; } }
function isHost(){ const w=myRole(); return !R.code||(w&&w.role==='host'); }
function canTeam(t){ const w=myRole(); return isHost()||(w&&w.role==='player'&&w.team===t); }
function setWho(role,team,idx){
  const v=role==='player'?{role:'player',team,name:roster(team)[idx].name}:{role};
  localStorage.setItem('dfb_who_'+R.code,JSON.stringify(v)); closeSettings(); render(); }
function openWhoPicker(){
  if(!R.code||!S||myRole())return;
  const sh=$('sheet');
  sh.innerHTML='<h2>Who are you?</h2><p class="hint">Players control their own team. Guests watch.</p>'+
  [0,1].map(t=>'<div class="eyebrow" style="margin:10px 0 2px">'+esc(S.teams[t].name)+'</div>'+
    roster(t).map((p,i)=>'<button class="pickbtn" onclick="setWho(\'player\','+t+','+i+')">'+esc(p.name)+'</button>').join('')).join('')+
  '<button class="pickbtn" style="margin-top:12px" onclick="setWho(\'guest\')">Guest — view only</button>'+
  (localStorage.getItem('dfb_admin')?'<button class="pickbtn" onclick="setWho(\'host\')">Host — full control</button>':'');
  $('overlay').classList.add('show');
}

/* ---------- persistence & sync ---------- */
function save(){ if(S) localStorage.setItem(LSK,JSON.stringify(S)); localStorage.setItem(LSH,JSON.stringify(hist)); roomSend(); }
const soberMode=()=>!!localStorage.getItem('dfb_sober');
function toggleSober(){ localStorage.setItem('dfb_sober',soberMode()?'':'1'); render(); }
function logLine(l){ return soberMode()? l.txt : (l.dtxt||l.txt); }
function log(txt){ S.log.unshift({q:S.qtr,t:fmt(effClock()),txt,dtxt:drunkify(txt)}); if(S.log.length>500)S.log.pop(); }
function roomSend(){ if(!R.applying && R.ws && R.ws.readyState===1 && S && S.phase!=='setup') R.ws.send(JSON.stringify({type:'state',state:S})); }
function serverURL(){
  if(!R.url){ R.url = /^https?:$/.test(location.protocol) ? location.origin : DEFAULT_SERVER;
    localStorage.setItem('dfb_server',R.url); }
  return R.url; }
function connectRoom(code){
  const u=serverURL(); if(!u)return;
  R.code=code.toUpperCase(); clearTimeout(R.retry);
  let ws; try{ ws=new WebSocket(u.replace(/^http/,'ws')+'/room/'+R.code+'/ws'); }catch(e){ alert('Bad server URL.'); R.code=null; return; }
  R.ws=ws;
  ws.onopen=()=>{ if(R.hosting){ R.hosting=false; roomSend(); }
    clearInterval(R.pinger); R.pinger=setInterval(()=>{ try{ws.send('{"type":"ping"}');}catch(e){} },30000); render(); };
  ws.onmessage=ev=>{ let m; try{m=JSON.parse(ev.data);}catch(e){return;}
    if(m.type==='state'&&m.seq>R.seq&&m.state){
      const first=R.seq===0;
      R.seq=m.seq; R.applying=true; S=m.state; if(!S.guestIn)S.guestIn=[false,false];
      if(first) shownEvt=(S.evt&&S.evt.n)||0;
      stopDrinkTick(); if(S.dphase==='drink'&&S.t0&&S.pauseE==null&&!S.timeout)startDrinkTick();
      stopClock(); if(S.running)startClock();
      localStorage.setItem(LSK,JSON.stringify(S));
      R.applying=false; render();
      if(first&&!myRole()) openWhoPicker(); } };
  ws.onclose=ev=>{ if(R.ws===ws)R.ws=null; clearInterval(R.pinger);
    if(ev&&ev.reason==='room closed'){
      const wasCode=R.code; R.code=null; R.seq=0; clearTimeout(R.retry);
      if(S)evt('ROOM '+wasCode+' CLOSED BY ADMIN','bad');
      alert('The admin closed room '+wasCode+'. You are now playing locally on this phone only.');
      render(); return; }
    render();
    if(R.code){ clearTimeout(R.retry); R.retry=setTimeout(()=>connectRoom(R.code),2500); } };
  ws.onerror=()=>{};
}
function leaveRoom(){ R.code=null; clearTimeout(R.retry); clearInterval(R.pinger);
  if(R.ws){ const w=R.ws; R.ws=null; try{w.close();}catch(e){} } R.seq=0; closeSettings(); render(); }
function goHome(){
  if(S&&S.phase==='game'){ setClockRun(false);
    if(S.dphase==='drink'&&S.t0!=null&&S.pauseE==null){ S.pauseE=now()-S.t0; } save(); }
  stopClock(); stopDrinkTick();
  if(R.code){ R.code=null; clearTimeout(R.retry); clearInterval(R.pinger);
    if(R.ws){ const w=R.ws; R.ws=null; try{w.close();}catch(e){} } R.seq=0; }
  S=null; closeSettings(); render(); }
function adminKey(){ let k=localStorage.getItem('dfb_admin');
  if(!k){ k=prompt('Host key (creating rooms requires one — ask Paul)'); if(!k)return null; k=k.trim(); localStorage.setItem('dfb_admin',k); }
  return k; }
function newRoomCode(u,then){

}
function hostRoom(fromSetup){

function roomRows(list){

function loadLobbyInto(id){

function joinRoom(){

function joinByCode(){ const c=prompt('Room code'); if(!c)return; closeSettings(); connectRoom(c.trim()); }
function closeRoom(code){ const k=adminKey(); if(!k)return;

    .catch(e=>alert('Could not reach the room server.')); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){
  if(R.code&&(!R.ws||R.ws.readyState>1))connectRoom(R.code);
  if(localStorage.getItem('dfb_awake'))setAwake(true); }});

/* ---------- drunk announcer ---------- */
function drunkLevel(){
  if(!S||!S.teams[0].players) return 0;
  let d=0, n=0;
  S.teams.forEach(t=>{ n+=t.players.length;
    t.players.concat(t.guest?[t.guest]:[]).forEach(p=>{ d+=drinkCt(p)+p.shots; }); });
  const per=n?d/n:0;
  return per>=6?3:per>=4?2:per>=2?1:0;
}
function drunkify(t){
  const lv=drunkLevel(); if(!lv) return t;
  const Rn=Math.random;
  let out=t.split(' ').map(w=>{
    if(w.includes('&')||w.includes(';')||w.includes('#')) return w;
    let x=w;
    if(lv>=1&&Rn()<.10) x=x.replace(/s/g,'sh').replace(/S/g,'Sh');
    if(lv>=2&&Rn()<.14&&x.length>2){ const i=1+Math.floor(Rn()*(x.length-1)); x=x.slice(0,i)+x[i-1]+x.slice(i); }
    if(lv>=3&&Rn()<.16&&x.length>4){ const m=x.slice(1,-1).split(''); for(let i=m.length-1;i>0;i--){const j=Math.floor(Rn()*(i+1)); const tmp=m[i]; m[i]=m[j]; m[j]=tmp;} x=x[0]+m.join('')+x[x.length-1]; }
    return x;
  }).join(' ');
  if(lv>=2) out=out.replace(/\.$/,'...').replace(/!/g,'!!');
  const tails={1:[' *hic*'],2:[' *hic*',' lesh gooo',' ok ok ok'],
    3:[' *hic* *hic*',' WAIT WHO HASH THE BALL',' i love thish game',' whered my drink go',' iss fine issfine']};
  if(Rn()<(lv===1?.2:lv===2?.3:.4)) out+=tails[lv][Math.floor(Rn()*tails[lv].length)];
  if(lv>=3&&Rn()<.2&&!out.includes('&')) out=out.toUpperCase();
  return out;
}

/* ---------- lifecycle ---------- */
function newGame(cfg){
  const mk=(n,ps)=>({name:n||'TEAM',score:0,coachUsed:false,players:ps.map(p=>({name:p,shots:0,chugsO:[],chugsD:[]}))});
  S={phase:'game',gname:cfg.gname||new Date().toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}),
     qscores:[[],[]],qbase:[0,0],teams:[mk(cfg.n0,cfg.p0),mk(cfg.n1,cfg.p1)],rot:[0,0],
     guestIn:[false,false],qtr:1,qlen:cfg.qlen,clock:cfg.qlen,canchor:null,running:false,poss:0,opening:0,down:1,defMod:0,
     tol:[3,3],timeout:null,brk:null,evt:{n:0,txt:'',kind:''},
     dphase:'pre',t0:null,pauseE:null,offT:null,defT:null,pend:null,dice:cfg.dice,
     log:[],stats:[freshStats(),freshStats()]};
  snaps=[]; shownEvt=0;
  log('Kickoff — '+S.teams[0].name+' ball, down 1. Clock runs while drinks are live.');
  save(); render();
}
function recordQuarter(){ [0,1].forEach(i=>S.qscores[i].push(S.teams[i].score-S.qbase[i])); S.qbase=[S.teams[0].score,S.teams[1].score]; }
function endGame(rec){
  if(rec){ S.clock=effClock(); recordQuarter(); }
  S.phase='final'; S.running=false; S.canchor=null; S.brk=null; S.timeout=null; stopClock(); stopDrinkTick();
  hist.push({date:new Date().toISOString(),gname:S.gname,qscores:S.qscores,log:S.log,
    names:[S.teams[0].name,S.teams[1].name],
    scores:[S.teams[0].score,S.teams[1].score],stats:S.stats,
    players:S.teams.map(t=>t.players.concat(t.guest&&drinkCt(t.guest)?[t.guest]:[]).map(p=>({name:p.name,shots:p.shots,drinks:drinkCt(p),
      avgO:p.chugsO.length?Math.round(p.chugsO.reduce((a,b)=>a+b,0)/p.chugsO.length):null,
      avgD:p.chugsD.length?Math.round(p.chugsD.reduce((a,b)=>a+b,0)/p.chugsD.length):null})))});
  save(); render();
}
function endQuarter(){
  setClockRun(false); S.clock=0; recordQuarter();
  stopDrinkTick();
  if(S.dphase!=='pre') log('Quarter ended mid-down — the down is void, no roll.');
  S.pend=null; S.t0=null; S.pauseE=null; S.offT=null; S.defT=null; S.defMod=0; S.dphase='pre'; S.timeout=null;
  if(S.qtr>=4 && S.teams[0].score!==S.teams[1].score){ evt('FINAL',''); endGame(false); return; }
  S.brk={next:S.qtr+1}; S.clock=S.qlen;
  evt('END OF '+qname(S.qtr),''); log('End of '+qname(S.qtr)+' — waiting for the host to start '+qname(S.qtr+1)+'.');
  save(); render();
}
function startQuarter(){
  if(!isHost()||!S.brk)return;
  const n=S.brk.next;
  S.qtr=n; S.brk=null; S.canchor=null; S.running=false; S.clock=S.qlen;
  S.teams.forEach(t=>t.coachUsed=false);
  if(n===3){ S.poss=other(S.opening); S.down=1; S.tol=[3,3]; S.defMod=0;
    log('Second half — halftime switch: '+S.teams[S.poss].name+' now on offense. Timeouts reset to 3.'); }
  else log(qname(n)+' underway. Coaching decisions reset.');
  evt(qname(n)+(n>4?' — OVERTIME':''),'');
  save(); render();
}

/* ---------- clock (auto: runs only while a chug is live) ---------- */
function setClockRun(on){
  if(on&&!S.running){ S.running=true; S.canchor=now(); startClock(); }
  else if(!on&&S.running){ S.clock=effClock(); S.canchor=null; S.running=false; stopClock(); }
}
function toggleClock(){ if(S.phase!=='game'||!isHost())return; setClockRun(!S.running); save(); render(); }
function startClock(){ stopClock();
  clockTick=setInterval(()=>{ if(!S||!S.running){stopClock();return;}
    const e=effClock();
    if(e<=0){ endQuarter(); return; }
    const el=$('clk'); if(el)el.textContent=fmt(e);
  },250);
}
function stopClock(){ if(clockTick){clearInterval(clockTick);clockTick=null;} }

/* ---------- drink race ---------- */
function startDown(){ if(!canTeam(S.poss))return;
  snapshot(); S.dphase='drink'; S.t0=now(); S.pauseE=null; S.offT=null; S.defT=null;
  setClockRun(true); startDrinkTick(); save(); render(); }
function startDrinkTick(){ stopDrinkTick(); tick=setInterval(()=>{ if(!S||S.dphase!=='drink'||S.pauseE!=null)return;
  const el=$('drinkT'); if(!el)return;
  const e=elapsedDrink(), th=thr(S.down), r=S.down;
  el.textContent=fmt(e);
  el.classList.toggle('over',e>th.b);
  if(e>th.b){ S.offT=th.b; stopDrinkTick(); evt('OVER THE LIMIT — TURNOVER','bad'); evalDown(true); return; }
  const b0=$('bt0'), b1=$('bt1');
  if(b0){
    if(r===4){ b0.classList.toggle('live',true); }
    else{ b0.classList.toggle('live',e<th.a); b0.classList.toggle('deadzone',e>=th.a);
          if(b1){ b1.classList.toggle('live',e>=th.a); } }
  }
},200); }
function stopDrinkTick(){ if(tick){clearInterval(tick);tick=null;} }
function markDef(){ if(S.defT!=null||S.dphase!=='drink'||!canTeam(other(S.poss)))return;
  S.defT=elapsedDrink();
  const nm=drinker(other(S.poss)).name;
  evt(esc(nm)+' — DEFENSE SUCCESSFUL','good');
  log(esc(nm)+' finished the defense drink at '+fmt(S.defT)+'.');
  save(); render(); }
function markOff(){ if(S.dphase!=='drink'||!canTeam(S.poss))return;
  S.offT=elapsedDrink(); stopDrinkTick();
  evt(esc(drinker(S.poss).name)+' finished — '+fmt(S.offT),'');
  evalDown(false); }
function manualTimes(){ if(!isHost())return;
  const o=prompt('Offense time (m:ss)','2:30'); if(o==null)return;
  const d=prompt('Defense time (m:ss) — blank if they did not finish','');
  const p=v=>{const m=v.trim().match(/^(\d+):([0-5]?\d)$/); return m?(+m[1]*60)+ +m[2]:null;};
  const ot=p(o); if(ot==null){alert('Bad format. Use m:ss');return;}
  S.offT=ot; S.defT=d&&p(d)!=null?p(d):null; stopDrinkTick(); evalDown(false);
}
function evalDown(auto){
  const r=S.down, th=thr(r);
  setClockRun(false);
  if(!auto){ drinker(S.poss).chugsO.push(S.offT); S.stats[S.poss].chugsO.push(S.offT); }
  if(S.defT!=null){ drinker(other(S.poss)).chugsD.push(S.defT); S.stats[other(S.poss)].chugsD.push(S.defT); }
  const hasDef=S.defT!=null && S.defT<S.offT;
  if(hasDef) S.stats[other(S.poss)].stops++;
  if(S.offT>=th.b&&auto){
    log('Down '+r+': '+esc(drinker(S.poss).name)+' hit the limit ('+fmt(th.b)+'). Turnover — possession over.');
    resolveDown('TO'); return;
  }
  if(S.offT>th.b){
    log('Down '+r+': over the limit ('+fmt(S.offT)+'). Turnover.');
    resolveDown('TO'); return;
  }
  const bucket=r===4?'four':(S.offT<th.a?'fast':'mid');
  S.pend={kind:'down',bucket,defense:hasDef};
  S.dphase='roll'; save(); render();
}

/* ---------- rolls ---------- */
function rollDie(){ return 1+Math.floor(Math.random()*6); }
function rollTeamFor(p){
  if(!p)return null;
  if(p.kind==='down')return S.poss;
  if(p.kind==='big')return BIG[p.id].side==='off'?S.poss:other(S.poss);
  if(p.kind==='coach')return p.team;
  if(p.kind==='sub')return p.team!=null?p.team:other(S.poss);
  if(p.kind==='patpick'||p.kind==='pat')return p.team;
  return null;
}
function doDigitalRoll(){
  if(!canTeam(rollTeamFor(S.pend)))return;
  const d=$('dieBox'); if(!d)return;
  d.classList.add('rolling','hot');
  let n=0; const anim=setInterval(()=>{ d.textContent=rollDie(); if(++n>16){clearInterval(anim); d.classList.remove('rolling');
    const v=+d.textContent; setTimeout(()=>applyRoll(v),500);} },100);
}
function applyRoll(n){
  const p=S.pend; if(!p)return;
  if(!canTeam(rollTeamFor(p)))return;
  snapshot(); p.roll=n;
  if(p.kind==='down')      resolveDown(TABLES[p.bucket][p.defense?'def':'no'][n]);
  else if(p.kind==='big')  resolveBig(p.id,n);
  else if(p.kind==='coach')resolveCoach(p.id,n);
  else if(p.kind==='sub')  resolveSub(n);
  else if(p.kind==='pat')  resolvePat(n);
}

/* ---------- resolutions ---------- */
function resolveDown(out){
  const T=S.teams[S.poss].name, p=S.pend||{};
  const ctx=p.roll?(' (rolled '+p.roll+(p.defense?', defense on':'')+')'):'';
  if(out==='TO'){ S.stats[S.poss].to++; if(p.roll)evt('Rolled '+p.roll+' — TURNOVER','bad');
    log('TURNOVER by '+T+ctx); changePoss(); }
  else if(out==='FD'){ S.stats[S.poss].fd++; evt('Rolled '+p.roll+' — FIRST DOWN','good');
    log('First down '+T+ctx+' — new set, times tighten. Refill, next drinkers up.');
    S.down=Math.min(4,S.down+1); nextDown(null); }
  else if(out==='FG'){ S.teams[S.poss].score+=3; S.stats[S.poss].fg++; evt('Rolled '+p.roll+' — FIELD GOAL','good');
    log('FIELD GOAL — '+T+' +3'+ctx); changePoss(); }
  else if(out==='TD'){ S.stats[S.poss].td++; S.teams[S.poss].score+=6; evt('Rolled '+p.roll+' — TOUCHDOWN','good');
    log('TOUCHDOWN — '+T+' +6'+ctx); startPat(S.poss,true); }
  save(); render();
}
function nextDown(msg){ stopDrinkTick(); setClockRun(false); S.defMod=0; S.guestIn=[false,false]; S.dphase='pre'; S.pend=null; S.t0=null; S.pauseE=null; S.offT=null; S.defT=null;
  S.rot[0]++; S.rot[1]++; if(msg)log(msg); save(); render(); }
function changePoss(){ S.poss=other(S.poss); S.down=1;
  nextDown(S.teams[S.poss].name+' takes over at down 1.'); }

/* ---------- big plays ---------- */
function pickShot(id){
  const b=BIG[id], team=b.side==='off'?S.poss:other(S.poss);
  if(!canTeam(team))return;
  const sh=$('sheet');
  sh.innerHTML='<h2>'+b.name+' — who takes the shot?</h2>'+
  roster(team).map((p,i)=>'<button class="pickbtn'+(drinker(team)===p?' cur':'')+'" onclick="shotGo(\''+id+'\','+team+','+i+')">'+esc(p.name)+'<small>'+drinkCt(p)+' drinks · '+p.shots+' shots</small></button>').join('')+
  '<button class="btn ghost sm" onclick="closeSettings()">Cancel</button>';
  $('overlay').classList.add('show');
}
function shotGo(id,team,pi){
  closeSettings(); snapshot();
  const b=BIG[id], p=roster(team)[pi];
  p.shots++; S.stats[team].shots++;
  if(S.dphase==='drink'&&S.t0&&S.pauseE==null){ S.pauseE=now()-S.t0; stopDrinkTick(); }
  setClockRun(false);
  evt('SHOT — '+esc(p.name)+' calls '+b.name.toUpperCase(),'');
  log('SHOT — '+esc(p.name)+' ('+S.teams[team].name+') calls '+b.name+'. Everything pauses.');
  S.pend={kind:'big',id,prev:S.dphase}; S.dphase='roll'; save(); render();
}
function resumePlay(prev){
  S.dphase=prev; S.pend=null;
  if(prev==='drink'&&!S.timeout){
    if(S.pauseE!=null){ S.t0=now()-S.pauseE; S.pauseE=null; }
    setClockRun(true); startDrinkTick(); }
  save(); render();
}
function resolveBig(id,n){
  const b=BIG[id], out=b.map[n], off=S.poss, def=other(S.poss);
  if(out==='N'){ evt(b.name+': rolled '+n+' — NOTHING',''); log(b.name+': nothing (rolled '+n+'). Play on.'); resumePlay(S.pend.prev); return; }
  if(out==='TD'){ S.stats[off].td++; S.teams[off].score+=6; evt(b.name.toUpperCase()+' — TOUCHDOWN','good'); log(b.name+' — TOUCHDOWN '+S.teams[off].name+' +6 (rolled '+n+')'); startPat(off,true); }
  else if(out==='OFF_TD'){ S.stats[off].td++; S.teams[off].score+=6; evt('INT BACKFIRES — TD OFFENSE','good'); log(b.name+' backfires — TOUCHDOWN '+S.teams[off].name+' +6 (rolled '+n+')'); startPat(off,true); }
  else if(out==='FD'){ S.stats[off].fd++; evt('SACK BACKFIRES — FIRST DOWN','good'); log(b.name+' backfires — automatic first down (rolled '+n+')'); S.down=Math.min(4,S.down+1); nextDown(null); }
  else if(out==='TO'){ S.stats[off].to++; evt(b.name+': rolled '+n+' — TURNOVER','bad'); log(b.name+': turnover (rolled '+n+')'); changePoss(); }
  else if(out==='HM_TO'){ S.stats[off].to++; evt('PICKED OFF — pick-6 roll coming','bad'); log('Hail Mary picked off (rolled 1)! '+S.teams[def].name+' rolls for the pick-6...');
    S.pend={kind:'sub',sub:'pick6',team:def,prev:'pre'}; save(); render(); return; }
  else if(out==='INT_TO'){ S.stats[off].to++; evt('INTERCEPTION — pick-6 roll coming','bad'); log('INTERCEPTION (rolled 6)! '+S.teams[def].name+' rolls for the pick-6...');
    S.pend={kind:'sub',sub:'pick6',team:def,prev:'pre'}; save(); render(); return; }
  else if(out==='SACK'){ S.defMod-=modUnit(); evt('SACK — windows −'+fmt(modUnit())+', strip roll coming','good'); log('SACK (rolled '+n+') — time windows −'+fmt(modUnit())+' this down. Rolling for the strip...');
    S.pend={kind:'sub',sub:'strip',team:def,prev:S.pend.prev}; save(); render(); return; }
  save(); render();
}
function resolveSub(n){
  const p=S.pend, ok=SUB_SUCCESS.includes(n);
  if(p.sub==='pick6'){
    if(ok){ S.stats[p.team].td++; S.teams[p.team].score+=6; evt('PICK SIX — rolled '+n,'good'); log('PICK SIX — '+S.teams[p.team].name+' +6 (rolled '+n+')'); startPat(p.team,false); }
    else { evt('No return — rolled '+n,''); log('No return (rolled '+n+').'); changePoss(); }
  } else if(p.sub==='strip'){
    if(ok){ S.stats[S.poss].to++; evt('STRIP SACK — TURNOVER','bad'); log('STRIP SACK (rolled '+n+') — turnover!'); changePoss(); }
    else { evt('No strip — rolled '+n,''); log('No strip (rolled '+n+'). Play on with tightened windows.'); resumePlay(p.prev||'pre'); }
  }
}

/* ---------- coaching & timeouts ---------- */
function startCoach(id){
  const c=COACH[id], team=id==='wildcat'?S.poss:other(S.poss);
  if(!canTeam(team))return;
  if(S.teams[team].coachUsed){alert(S.teams[team].name+' already used their coaching decision this quarter.');return;}
  if(!confirm(S.teams[team].name+' burns their coaching decision on '+c.name+'? (Once per quarter, before the down.)'))return;
  snapshot(); S.teams[team].coachUsed=true; S.stats[team].coach++;
  log('Coaching decision — '+S.teams[team].name+' calls '+c.name+'.');
  S.pend={kind:'coach',id,team}; S.dphase='roll'; save(); render();
}
function resolveCoach(id,n){
  const c=COACH[id], out=c.map[n], team=S.pend.team;
  if(out==='TO'){ S.stats[S.poss].to++; evt(c.name.toUpperCase()+' BLOWS UP — TURNOVER','bad'); log(c.name+' blows up (rolled 6) — turnover on '+S.teams[S.poss].name+'.'); changePoss(); return; }
  S.guestIn[team]=true;
  const nm=esc(drinker(team).name), mu=fmt(modUnit());
  if(out==='SUB'){ evt(c.name+': '+nm+' steps in',''); log(c.name+' (rolled '+n+'): '+nm+' drinks this down.'); }
  else { S.defMod+=(c.mod>0?1:-1)*modUnit(); evt(c.name+': '+nm+' in, windows '+(c.mod>0?'+':'−')+mu,''); log(c.name+' (rolled '+n+'): '+nm+' in, time windows '+(c.mod>0?'+':'−')+mu+' this down.'); }
  S.dphase='pre'; S.pend=null; save(); render();
}
function callTimeout(t){
  if(!canTeam(t)||S.tol[t]<=0||S.timeout||S.dphase==='roll'||S.brk)return;
  snapshot(); S.tol[t]--;
  S.timeout={team:t};
  if(S.dphase==='drink'&&S.t0&&S.pauseE==null){ S.pauseE=now()-S.t0; stopDrinkTick(); }
  setClockRun(false);
  evt('TIMEOUT — '+esc(S.teams[t].name),''); log('Timeout, '+S.teams[t].name+' ('+S.tol[t]+' left this half). Everything pauses.');
  save(); render();
}
function endTimeout(){
  if(!S.timeout)return;
  if(!isHost()&&!canTeam(S.timeout.team))return;
  S.timeout=null;
  if(S.dphase==='drink'&&S.pauseE!=null){ S.t0=now()-S.pauseE; S.pauseE=null; setClockRun(true); startDrinkTick(); }
  evt('BACK TO IT',''); log('Timeout over.');
  save(); render();
}

/* ---------- PAT ---------- */
function startPat(team,flipAfter){ S.pend={kind:'patpick',team,flipAfter}; S.dphase='roll'; save(); render(); }
function pickPat(mode){ if(!canTeam(S.pend.team))return; S.pend.kind='pat'; S.pend.mode=mode; render(); }
function resolvePat(n){
  const p=S.pend, T=S.teams[p.team].name;
  if(p.mode==='kick'){ if(n>=2){S.teams[p.team].score+=1; evt('PAT GOOD','good'); log('PAT good — '+T+' +1 (rolled '+n+')');} else {evt('PAT MISSED — rolled 1','bad'); log('PAT missed (rolled 1).');} }
  else { if(n>=5){S.teams[p.team].score+=2; evt('TWO-POINT GOOD','good'); log('Two-point conversion GOOD — '+T+' +2 (rolled '+n+')');} else {evt('TWO-POINT FAILS','bad'); log('Two-point try fails (rolled '+n+').');} }
  if(p.flipAfter) changePoss();
  else { S.down=1; nextDown(S.teams[S.poss].name+' keeps the ball at down 1 after the defensive score.'); }
}

/* ---------- edits (host only) ---------- */
function editName(i){ if(!isHost())return; const v=prompt('Team name',S.teams[i].name); if(v){S.teams[i].name=v.trim().slice(0,14)||S.teams[i].name; save(); render();} }
function editScore(i){ if(!isHost())return; const v=prompt('Host override — set score for '+S.teams[i].name,S.teams[i].score); if(v!=null&&!isNaN(+v)){snapshot();S.teams[i].score=Math.max(0,+v);save();render();} }
function editDown(){ if(!isHost())return; const v=prompt('Set downs (1-4)',S.down); if(v&&[1,2,3,4].includes(+v)){snapshot();S.down=+v;save();render();} }
function flipPoss(){ if(!isHost())return; if(!confirm('Manually flip possession?'))return; snapshot(); S.poss=other(S.poss); S.down=1; nextDown('Possession set to '+S.teams[S.poss].name+' (manual).'); }
function editClock(){ if(!isHost())return; const v=prompt('Set clock (m:ss)',fmt(effClock())); if(!v)return; const m=v.trim().match(/^(\d+):([0-5]?\d)$/); if(m){snapshot();S.clock=(+m[1]*60)+ +m[2]; if(S.running)S.canchor=now(); save();render();} }

/* ---------- render ---------- */
function render(){
  const app=$('app');
  if(!S||S.phase==='setup'){ app.innerHTML=setupHTML(); loadLobbyInto('homeLobby'); return; }
  if(S.phase==='final'){ app.innerHTML=finalHTML(); toastCheck(); return; }
  app.innerHTML='<div class="gamecols"><div class="colL">'+scoreHTML()+stageHTML()+chipsHTML()+
    '</div><div class="colR">'+logHTML()+statsHTML()+'</div></div>';
  if(S.running&&!clockTick)startClock();
  toastCheck();
}
function toastCheck(){
  if(!S||!S.evt||S.evt.n<=shownEvt)return;
  shownEvt=S.evt.n;
  const d=document.createElement('div'); d.className='splash '+(S.evt.kind||'');
  d.innerHTML=S.evt.txt; document.body.appendChild(d);
  setTimeout(()=>{ d.classList.add('out'); setTimeout(()=>d.remove(),400); },2200);
}

    '<button class="tool" onclick="openSettings()">☰ Menu</button></div></header>';

function mapLine(map){
  const names={TO:'TO',FD:'1st',TD:'TD',FG:'FG'};

    '<button class="btn amber" id="offBtn" onclick="markOff()" '+(canTeam(S.poss)?'':'disabled')+'>'+esc(drinker(S.poss).name)+' finished</button></div>'+
    (isHost()?'<button class="btn ghost sm" onclick="manualTimes()">Enter times manually</button>':'')+'</div>';

function describeMap(map){
  const names={TO:'TO',FD:'1st',TD:'TD',FG:'FG',N:'—',HM_TO:'TO⊕',INT_TO:'TO⊕',SACK:'−1:00⊕',OFF_TD:'TD (off)',SUB:'Sub',SUBMOD:'Sub±1:00'};
  const groups=[]; let st=1;
  for(let n=2;n<=7;n++){ if(n===7||map[n]!==map[st]){ groups.push('<span class="stake"><b>'+(st===n-1?st:st+'–'+(n-1))+'</b> '+names[map[st]]+'</span>'); st=n; } }
  return '<div class="stakes">'+groups.join('')+'</div>';
}
function rollHTML(){
  const p=S.pend; let title='',ctx='',map=null,special='';
  const team=rollTeamFor(p), allowed=canTeam(team);
  if(p.kind==='down'){ title='The roll — downs '+S.down;
    ctx=(p.defense?'DEFENSE SUCCESSFUL':'No defense')+' · '+(p.bucket==='four'?'made the limit':p.bucket==='fast'?'fast window':'slow window')+' · chug '+fmt(S.offT);
    map=TABLES[p.bucket][p.defense?'def':'no']; }
  else if(p.kind==='big'){ title=BIG[p.id].name; ctx='Big play — shot taken, everything paused'; map=BIG[p.id].map; }
  else if(p.kind==='coach'){ title=COACH[p.id].name; ctx='Coaching decision'; map=COACH[p.id].map; }
  else if(p.kind==='sub'){ title=p.sub==='pick6'?'Pick-six roll':'Strip-sack roll'; ctx=esc(S.teams[p.team].name)+' rolls — 4–6 converts';
    map={1:'N',2:'N',3:'N',4:p.sub==='pick6'?'TD':'TO',5:p.sub==='pick6'?'TD':'TO',6:p.sub==='pick6'?'TD':'TO'}; }
  else if(p.kind==='patpick'){
    return '<div class="card"><h2>Touchdown — '+esc(S.teams[p.team].name)+'</h2>'+
    '<p class="hint">Kick is good on 2–6 (+1). Going for two needs 5 or 6 (+2).</p>'+
    (allowed?'<div class="btnrow"><button class="btn amber" onclick="pickPat(\'kick\')">Kick PAT</button>'+
    '<button class="btn" onclick="pickPat(\'two\')">Go for 2</button></div>':
    '<p class="hint" style="color:var(--amber)">Waiting for '+esc(S.teams[p.team].name)+' to choose\u2026</p>')+'</div>';
  }
  else if(p.kind==='pat'){ title=p.mode==='kick'?'PAT kick':'Two-point try'; ctx=esc(S.teams[p.team].name);
    special=p.mode==='kick'?'<div class="stakes"><span class="stake"><b>1</b> miss</span><span class="stake"><b>2–6</b> +1</span></div>'
                           :'<div class="stakes"><span class="stake"><b>1–4</b> no good</span><span class="stake"><b>5–6</b> +2</span></div>'; }
  const stakes=special||(map?describeMap(map):'');
  const dice=!allowed
    ? '<p class="hint" style="text-align:center;color:var(--amber)">Waiting for '+esc(S.teams[team].name)+' to roll\u2026</p>'
    : (S.dice==='digital'
      ? '<div class="die digits" id="dieBox">?</div><button class="btn amber" onclick="doDigitalRoll()">Roll</button>'
      : '<p class="hint" style="text-align:center">Roll a real die, tap the result.</p><div class="manualdice">'+[1,2,3,4,5,6].map(n=>'<button onclick="applyRoll('+n+')">'+n+'</button>').join('')+'</div>');
  return '<div class="card"><h2>'+title+'</h2><p class="hint">'+ctx+'</p>'+stakes+dice+
  (allowed?'<button class="btn ghost sm" onclick="toggleDice()">Dice: '+S.dice+' — switch</button>':'')+'</div>';

function rulesBody(){

  '<tr><td>3</td><td>&lt;2:00</td><td>2–4</td><td>&gt;4:00</td></tr><tr><td>4</td><td colspan="2">&lt;1:30 (FG live)</td><td>&gt;1:30</td></tr></table>'+
  '<p>Hitting the auto-TO limit ends the possession instantly — no roll.</p>'+
  '<h3>Left table</h3><table><tr><th></th><th>TO</th><th>1st</th><th>TD</th></tr><tr><td>No def</td><td>1</td><td>2–3</td><td>4–6</td></tr><tr><td>Defense</td><td>1–2</td><td>3–6</td><td>✕</td></tr></table>'+
  '<h3>Right table</h3><table><tr><th></th><th>TO</th><th>1st</th><th>TD</th></tr><tr><td>No def</td><td>1–2</td><td>3–4</td><td>5–6</td></tr><tr><td>Defense</td><td>1–3</td><td>4–6</td><td>✕</td></tr></table>'+
  '<h3>Downs 4</h3><table><tr><th></th><th>TO</th><th>1st</th><th>FG</th><th>TD</th></tr><tr><td>No def</td><td>1</td><td>2</td><td>3–4</td><td>5–6</td></tr><tr><td>Defense</td><td>1–3</td><td>4–5</td><td>6</td><td>✕</td></tr></table>'+
  '<h3>Big plays (player takes a shot; everything pauses)</h3>'+
  '<table><tr><th style="text-align:left">Play</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr>'+
  bigRow('Hail Mary',BIG.hail.map,'offense')+bigRow('4th Down',BIG.fourth.map,'offense')+
  bigRow('Sack',BIG.sack.map,'defense')+bigRow('Interception',BIG.int.map,'defense')+'</table>'+
  '<p>⊕ triggers a second roll by the defense — 4–6 converts (strip sack \u2192 turnover, pick \u2192 pick-six touchdown).</p>'+
  '<h3>Coaching (1/qtr, pre-snap)</h3><p>Wildcat (off) / Blitz (def): 1–3 new drinker in · 4–5 new drinker + def +1:00 / −1:00 · 6 turnover. No shot option for the extra player.</p>'+
  '<h3>Timeouts</h3><p>Three per team per half. A timeout freezes the game clock and the live drink timer until the calling team or the host resumes.</p>'+
  '<h3>Scoring</h3><p>TD 6 · PAT +1 (miss on 1) · two-point +2 (5–6) · FG 3. After a defensive TD the offense keeps the ball at down 1.</p>'+
  '</div>';
}
function refHTML(){ return '<details><summary>Rules cheat sheet</summary>'+rulesBody()+'</details>'; }
function openRules(){
  $('sheet').innerHTML='<h2>Dice Football — Rules</h2>'+rulesBody()+'<button class="btn ghost sm" onclick="closeSettings()">Close</button>';
  $('overlay').classList.add('show');
}
function qTable(g){
  if(!g.qscores||!g.qscores[0]||!g.qscores[0].length) return '';
  const n=g.qscores[0].length;
  const hd=Array.from({length:n},(_,i)=>'<th>'+(i<4?'Q'+(i+1):'OT'+(i-3>1?i-3:''))+'</th>').join('');
  const rows=[0,1].map(i=>'<tr><td>'+esc(g.names[i])+'</td>'+g.qscores[i].map(v=>'<td>'+v+'</td>').join('')+'<td><b>'+g.scores[i]+'</b></td></tr>').join('');
  return '<table class="statgrid"><tr><th></th>'+hd+'<th>T</th></tr>'+rows+'</table>';
}
function openHistory(){
  const sh=$('sheet');
  if(!hist.length){ sh.innerHTML='<h2>Game history</h2><p class="hint">No games saved yet. Finish a game and it lands here.</p><button class="btn ghost sm" onclick="closeSettings()">Close</button>'; }
  else sh.innerHTML='<h2>Game history</h2>'+
    hist.map((g,i)=>({g,i})).reverse().map(({g,i})=>'<button class="pickbtn" onclick="openGameDetail('+i+')">'+esc(g.gname||g.date.slice(0,10))+'<small>'+esc(g.names[0])+' '+g.scores[0]+' — '+g.scores[1]+' '+esc(g.names[1])+'</small></button>').join('')+
    '<button class="btn ghost sm" onclick="closeSettings()">Close</button>';
  $('overlay').classList.add('show');
}
function openGameDetail(i){
  const g=hist[i], w=g.scores[0]===g.scores[1]?null:(g.scores[0]>g.scores[1]?g.names[0]:g.names[1]);
  let pl='';
  (g.players||[]).forEach((tp,ti)=>tp.forEach(p=>{ pl+='<tr><td>'+esc(p.name)+' <span style="color:var(--muted)">('+esc(g.names[ti])+')</span></td><td>'+p.drinks+'</td><td>'+(p.avgO!=null?fmt(p.avgO):(p.avg!=null?fmt(p.avg):'—'))+'</td><td>'+(p.avgD!=null?fmt(p.avgD):'—')+'</td><td>'+p.shots+'</td></tr>'; }));
  $('sheet').innerHTML='<h2>'+esc(g.gname||'Game')+'</h2>'+
  '<p class="hint">'+new Date(g.date).toLocaleString()+(w?' · '+esc(w)+' won':' · tie')+'</p>'+
  '<div class="finalscore digits" style="font-size:1.9rem">'+g.scores[0]+' — '+g.scores[1]+'</div>'+
  '<div class="ref"><h3>Scoring by quarter</h3>'+ (qTable(g)||'<p>Not recorded for this game.</p>') +
  '<h3>Team stats</h3>'+statTable(g.names,g.stats)+
  (pl?'<h3>Players</h3><table class="statgrid"><tr><th>Player</th><th>Drinks</th><th>Avg O</th><th>Avg D</th><th>Shots</th></tr>'+pl+'</table>':'')+
  '</div>'+
  (g.log&&g.log.length?'<details><summary>Play-by-play ('+g.log.length+') — '+(soberMode()?'sober':'as heard')+'</summary>'+g.log.map(l=>'<div class="logline"><span class="lt">'+qname(l.q)+' '+l.t+'</span>'+logLine(l)+'</div>').join('')+'</details>':'')+
  '<div class="btnrow"><button class="btn sm" onclick="openHistory()">← All games</button><button class="btn ghost sm" onclick="closeSettings()">Close</button></div>';
}

/* ---------- setup / final / settings ---------- */
function setupHTML(){
  let resume=false;
  try{ const st=JSON.parse(localStorage.getItem(LSK)); resume=st&&st.phase==='game'; }catch(e){}
  return '<div class="hero"><div class="eyebrow">Roof deck rules</div><h1>Dice <span>Football</span></h1>'+
  '<p class="hint" style="margin-top:6px">Chug the down. Roll the die. Live with it.</p></div>'+
  '<div class="card"><h2>New game</h2>'+
  '<div class="field"><label>Game name</label><input id="gname" value="'+new Date().toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})+'" maxlength="40"></div>'+
  '<div class="field"><label>Home team</label><input id="n0" value="HOME" maxlength="14"></div>'+
  '<div class="field"><label>Home players (comma-separated, min 2)</label><input id="p0" value="Paul, HK"></div>'+
  '<div class="field"><label>Away team</label><input id="n1" value="AWAY" maxlength="14"></div>'+
  '<div class="field"><label>Away players (comma-separated, min 2)</label><input id="p1" value="Nick, Mike"></div>'+
  '<div class="field"><label>Quarter length</label><select id="qlen"><option value="480">8:00</option><option value="600" selected>10:00</option><option value="720">12:00</option><option value="900">15:00</option></select></div>'+
  '<div class="field"><label>Dice</label><div class="seg"><button id="dg" class="on" onclick="segDice(\'digital\')">Digital</button><button id="dm" onclick="segDice(\'manual\')">Real dice</button></div></div>'+
  '<button class="btn amber" onclick="launch()">Kickoff (this phone only)</button>'+
  '<div class="btnrow"><button class="btn sm" onclick="hostRoom(true)">Host online room</button>'+
  '<button class="btn sm" onclick="joinRoom()">Join room</button></div>'+
  '<div class="btnrow"><button class="btn sm" onclick="openRules()">Rules & how to play</button>'+
  '<button class="btn sm" onclick="openHistory()">Game history'+(hist.length?' ('+hist.length+')':'')+'</button></div>'+
  (resume?'<button class="btn" onclick="resumeGame()">Resume game in progress</button>':'')+
  '<button class="btn ghost sm" onclick="openSettings()">Data & settings</button></div>'+
  '<div class="card"><h2>Games in progress <button class="tool" style="float:right" onclick="loadLobbyInto(\'homeLobby\')">↻</button></h2>'+
  (R.code?'<p class="hint" style="color:var(--amber)">Connected to room '+R.code+' — waiting for the game to arrive\u2026</p>':'')+
  '<div id="homeLobby"><p class="hint">Checking\u2026</p></div></div>'+
  '<p class="notice">Drink responsibly. This app scores the game; it does not require anyone to drink anything.</p>';
}
function launch(){
  const parse=v=>v.split(',').map(x=>x.trim()).filter(Boolean).slice(0,12);
  const p0=parse($('p0').value), p1=parse($('p1').value);
  if(p0.length<2||p1.length<2){alert('Each team needs at least 2 players.');return;}
  newGame({gname:$('gname').value.trim(),n0:$('n0').value,n1:$('n1').value,p0,p1,qlen:+$('qlen').value,dice:window._dice||'digital'});
}
function segDice(v){ window._dice=v; $('dg').classList.toggle('on',v==='digital'); $('dm').classList.toggle('on',v==='manual'); }
function resumeGame(){ S=JSON.parse(localStorage.getItem(LSK)); if(!S.guestIn)S.guestIn=[false,false]; S.running=false; S.canchor=null; shownEvt=(S.evt&&S.evt.n)||0; render(); }
function finalHTML(){
  const [a,b]=S.teams; const w=a.score===b.score?null:(a.score>b.score?a:b);
  return '<div class="hero"><div class="eyebrow">Final'+(S.qtr>4?' · OT':'')+'</div><h1>'+esc(a.name)+' vs '+esc(b.name)+'</h1></div>'+
  '<div class="card"><div class="finalscore digits">'+a.score+' — '+b.score+'</div>'+
  (w?'<div class="winner">'+esc(w.name)+' wins</div>':'<div class="winner">Tie</div>')+
  '<div style="margin-top:10px">'+statTable([a.name,b.name],S.stats)+playerTable()+'</div>'+
  '<button class="btn amber" onclick="S=null;localStorage.removeItem(LSK);render()">New game</button></div>'+logHTML();
}
function openSettings(){
  const sh=$('sheet');
  const roomBits = R.code
    ? '<p class="hint" style="margin-bottom:8px">Room <b style="color:var(--amber)">'+R.code+'</b> — '+(R.ws&&R.ws.readyState===1?'connected':'reconnecting…')+(myRole()?' · you: '+(myRole().name||myRole().role):'')+'</p>'+
      '<button class="btn red sm" onclick="leaveRoom()">Leave room (keep playing locally)</button>'
    : (S&&S.phase==='game'?'<button class="btn sm" onclick="hostRoom(false)">Share this game online (host room)</button>':'')+
      '<button class="btn sm" onclick="joinRoom()">Join room</button>';
  sh.innerHTML='<h2>Menu</h2>'+
  (S&&S.phase!=='setup'?'<button class="btn sm" onclick="goHome()">⌂ Home (game stays saved)</button>':'')+roomBits+
  '<button class="btn sm" onclick="setAwake(!localStorage.getItem(\'dfb_awake\'));closeSettings()">Keep screen awake: '+(localStorage.getItem('dfb_awake')?'ON — turn off':'OFF — turn on')+'</button>'+
  '<button class="btn ghost sm" onclick="setServer()">Set room server URL</button>'+
  (S&&S.phase==='game'&&isHost()?'<button class="btn red sm" onclick="if(confirm(\'End this game now and save it to history?\')){endGame(true);closeSettings();}">End game (save to history)</button>'+
  '<button class="btn red sm" onclick="if(confirm(\'Abandon game without saving?\')){S=null;localStorage.removeItem(LSK);closeSettings();render();}">Abandon game</button>':'')+
  '<button class="btn sm" onclick="openHistory()">Game history'+(hist.length?' ('+hist.length+')':'')+'</button>'+
  '<button class="btn sm" onclick="exportData()">Export history (JSON)</button>'+
  '<label class="btn sm" style="text-align:center">Import history<input type="file" accept=".json" style="display:none" onchange="importData(event)"></label>'+
  (hist.length?'<button class="btn red sm" onclick="if(confirm(\'Delete ALL saved game history?\')){hist=[];save();closeSettings();render();}">Clear history ('+hist.length+' games)</button>':'')+
  '<button class="btn ghost sm" onclick="closeSettings()">Close</button>'+
  '<p class="notice">Data lives in this browser\u2019s storage — export after big nights.</p>';
  $('overlay').classList.add('show');
}
function setServer(){ const v=prompt('Room server URL',R.url||DEFAULT_SERVER); if(v==null)return;
  R.url=v.trim().replace(/\/+$/,''); localStorage.setItem('dfb_server',R.url); }
function closeSettings(){ $('overlay').classList.remove('show'); }
function exportData(){
  const blob=new Blob([JSON.stringify({hist,exported:new Date().toISOString()},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='dice-football-history.json'; a.click();
}
function importData(ev){
  const f=ev.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(Array.isArray(d.hist)){hist=d.hist; save(); alert('Imported '+hist.length+' games.'); closeSettings(); render();} else alert('Not a valid export file.'); }catch(e){alert('Could not parse file.');} };
  r.readAsText(f);
}
$('overlay').addEventListener('click',e=>{ if(e.target.id==='overlay')closeSettings(); });

/* ---------- boot ---------- */
(function(){
  try{ hist=JSON.parse(localStorage.getItem(LSH))||[]; }catch(e){ hist=[]; }
  S=null; render();
  if(localStorage.getItem('dfb_awake')) setAwake(true);
  setInterval(()=>{ if((!S||S.phase==='setup')&&!document.hidden) loadLobbyInto('homeLobby'); },10000);
})();
</script>
</body>
</html>
